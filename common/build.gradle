buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

apply plugin: 'kotlin'
apply plugin: 'maven-publish'

group = 'com.github.HydeYYHH'
version = System.getenv('VERSION') ?: providers.gradleProperty('releaseVersion').getOrElse('unspecified')

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

kotlin {
    compilerOptions {
        languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

sourceSets {
    consumer {
        java.srcDir 'src/consumer/java'
        compileClasspath = files(jar.archiveFile) + configurations.runtimeClasspath
        runtimeClasspath = output + compileClasspath
    }
}
compileConsumerJava.dependsOn jar
task verifyStandalone(type: JavaExec) {
    dependsOn compileConsumerJava
    classpath = sourceSets.consumer.runtimeClasspath
    mainClass = 'example.Standalone'
}
check.dependsOn verifyStandalone

test { exclude '**/OnlineReadTest.class' }
task onlineReadTest(type: Test) {
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/OnlineReadTest.class'
    systemProperty 'msc.online', 'true'
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'MediaServiceCore'
            from components.java
            pom {
                name = 'MediaServiceCore'
                description = 'Standalone JVM core for YouTube content, account actions and playback.'
                url = 'https://github.com/HydeYYHH/MediaServiceCore'
                scm {
                    connection = 'scm:git:https://github.com/HydeYYHH/MediaServiceCore.git'
                    url = 'https://github.com/HydeYYHH/MediaServiceCore'
                }
            }
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal).configureEach {
    dependsOn tasks.named('check')
}
